[project]
name = "vacancy-role-classifier"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "mlflow==3.17.2",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
train = [
    "botocore[crt]>=1.43.117",
    "dvc[s3]>=3.67.1",
    "httpx>=0.28.1",
    "selectolax>=1.0.2",
    "sentence-transformers>=6.2.0",
]

[tool.uv]
default-groups = ["train"]